name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Environment to run tests against (used for manual runs)'
        required: true
        default: STAGING
        type: choice
        options:
          - PRS
          - STAGING
          - PROD
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Select test environment
      # workflow_dispatch -> whatever env was chosen when triggering manually
      # pull_request      -> PRS (PR/preview environment)
      # push (main/master) -> STAGING
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "TEST_ENV=${{ inputs.test_env }}" >> "$GITHUB_ENV"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "TEST_ENV=PRS" >> "$GITHUB_ENV"
        else
          echo "TEST_ENV=STAGING" >> "$GITHUB_ENV"
        fi
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
